[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircrafter2"
version = "0.1.0"
description = "AirCrafter 2.0: a DBF-specific MDAO framework (OpenMDAO) for conceptual design of small electric RC aircraft"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Lucas Sedeyn" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openmdao==3.45.0",
    "openaerostruct==2.12.0",
    "numpy==2.5.2",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
    "neuralfoil==0.3.3",
    "aerosandbox==4.2.10",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "sympy==1.14.0"]
ui = ["streamlit==1.64.0"]
docs = ["pyxdsm==2.3.2"]
dev = ["ruff==0.17.3"]

[project.scripts]
aircrafter2 = "aircrafter2.cli:main"

[tool.setuptools.packages.find]
include = ["aircrafter2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
exclude = ["tests", "studies", "verification", "examples", "configs", "archive", "reference", "third_party", "outputs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E741: `I` (current) and `l` (length) are equation symbols, kept to match the equations
ignore = ["E741"]
per-file-ignores = {"__init__.py" = ["F401"]}
