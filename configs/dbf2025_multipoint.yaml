# 2024-25 DBF ruleset (X-1 Supersonic Flight Program): multipoint design problem, M2 + M3 on one airframe.
# Problem: aircrafter2/problems/multipoint.py; plan and sources: docs/development/RESULTS_PLAN.md.
# Citations: [R] Rules_2025.pdf page; [W] 2025 USYD DBF Design Report (Project Woombah) page/table;
# [TM] THESIS/3_LITERATURE/25 competition/T-Motor V3115/ (manufacturer spec table). PLACEHOLDER = not sourced
# (docs/PLACEHOLDERS.md). The propulsion layout and components are Woombah's; the airframe is the design.
extends: full_mdo_twin.yaml
ruleset: rulesets/dbf_2024_25.yaml           # site, mission, scoring (R2, R3, X-1), stores, rule limits, headwind spread
# The placeholder values (powertrain, component masses, structure, stability) are in configs/placeholders.yaml, with
# their [W]/[TM] citations; the 2024-25 rule values in configs/rulesets/dbf_2024_25.yaml (docs/development/PLACEHOLDERS_RULESETS_PLAN.md).

airfoil: {seed: clarky, n_modes: 0}          # Clark Y: Woombah's wing airfoil [W p. 20, Table 18]
mass:
  inputs:
    n: 5.0                                   # design load factor 5 g, FOS 1.5 [W p. 3, p. 20]; the same for every design

propulsion:
  n_motors: 2                                # twin wing tractors [W p. 14]
  battery_topology: per_motor                # one pack per propulsion system [R p. 14]
  n_cells: 6                                 # 6S [W p. 22] (cells are enumerated: 4S, 5S, 6S)
  v_top: 80.0                                # m/s: above every level speed inside the Kv bounds (corner sweep,
                                             # docs/studies/results/validation_2025.md)
  fit_range: throttle                        # T(v) fit below the windmill speed at each throttle (part throttle)

design_variables:
  b: {lower: 0.9, upper: 1.829}              # m, span <= 6 ft [R p. 8]
  Kv: {lower: 400.0, upper: 1050.0}          # rpm/V: the V3115 family's catalogue windings 400-1050 KV [TM]
  capacity: {lower: 0.5, upper: 4.0}         # Ah per pack; the 100 Wh total [R p. 14] is a constraint
  x_batt: {lower: -0.8, upper: 0.2}          # m; Woombah moves the batteries to -29.37 in for M3 [W Table 34]

initial: {b: 1.6, c: 0.3, tc_scale: 1.0, camber_scale: 1.0, alpha_cruise: 4.0, v: 30.0, capacity: 2.0,
          l_ht: 0.9, S_ht: 0.12, S_vt: 0.05, x_batt: -0.1, Kv: 900.0}

multipoint:
  points:
    M2: {prop: 10x7E}                        # enumerated: 9x6E, 10x7E, 11x8E [W p. 22]; the prop may change per
    M3: {prop: 10x7E}                        # flight attempt [R p. 14]
  per_point: [capacity, x_batt, throttle]
  per_point_bounds:
    throttle: {lower: 0.5, upper: 1.0}       # pilot setting per flight; below ~0.3-0.5 the aircraft cannot hold level
                                             # flight (validation_2025.md section 1), so the optimiser is kept out
  per_point_initial: {throttle_M2: 1.0, throttle_M3: 0.6}
  fuel: {lower: 0.5, upper: 100.0}           # kg; capped at the declared tanks' capacity (stores)
  fuel_initial: 4.0
