# Full AirCrafter 2.0 MDF problem: propulsion (decision B), stability, parasite drag.
# Schema: aircrafter2/problems/full_mdo.py (FullMDOConfig). SI units. PLACEHOLDER = not USYD data.
# Values marked PLACEHOLDER are not USYD data (docs/OPEN_QUESTIONS.md). The placeholder values themselves are in
# configs/placeholders.yaml and the rule-dependent ones in configs/rulesets/generic.yaml; a value set here overrides
# both (docs/PLACEHOLDERS_RULESETS_PLAN.md).

placeholders: placeholders.yaml        # universal placeholders and assumptions (layer 2)
ruleset: rulesets/generic.yaml          # rule-dependent values: altitude, mission time, course, headwind spread (layer 3)

airfoil: {seed: naca4412, n_modes: 0}
aero: {num_x: 2, num_y: 21, spacing: cosine, model_size: xlarge}

mass_config: mass_garcia_gamboa_2022.yaml   # base mass-model config, relative to this file
mass:                    # overrides merged over mass_config
  inputs:
    n: 5.0               # assumptions_file.m load factor

geometry:
  l_ht: 0.8              # m, PLACEHOLDER tail arm
  S_ht: 0.06             # m^2, PLACEHOLDER
  S_vt: 0.03             # m^2, PLACEHOLDER
  x_spar: 0.25           # brief default

clmax_ratio_min: 1.44    # cruise at >= 1.2 V_stall
wall_ratio_max: 0.2      # thin-wall validity of the tube equations

polar_turn_frac: 0.95    # three-point polar: cruise, mid, C_L = 0.95 C_L,max
fuselage_drag: true      # switchable fuselage (cargo box + boom) parasite drag
mu_roll: 0.02            # assumptions_file.m
n_struct: 5.0            # assumptions_file.m

scoring:
  plugin: three_lap_time # placeholder objective; or laps_in_window, or 'module:Class' (docs/how_to_add_a_scoring_plugin.md)
require_3lap_energy: true

propulsion:              # decision B: the powertrain sets the power; cruise speed is where T = D
  n_motors: 1            # 1 = centreline nose tractor; 2 = wing pair (configs/full_mdo_twin.yaml)
  battery_topology: per_motor  # one pack per motor; capacity (a DV) is PER PACK
  prop: 11x7E            # APC PER3 file (discrete choice, D4: enumerate in examples/full_mdo.py)
  throttle: 1.0          # full throttle (the fastest-lap placeholder objective)
  n_cells: 4             # PLACEHOLDER (Q8)
  usable_fraction: 0.8   # assumptions_file.m
  rpm_fraction: 0.85     # of APC's 150000/D, propSelector.m
  v_top: 50.0            # m/s, T(v) fit range (above the full-throttle level speed)

stability:
  x_cb_frac: 0.25        # initial cargo/payload centre (chord fraction); a design variable below

design_variables:
  b: {lower: 0.9, upper: 1.52}
  c: {lower: 0.15, upper: 0.45}
  tc_scale: {lower: 0.5, upper: 1.6}
  camber_scale: {lower: 0.0, upper: 2.0}
  capacity: {lower: 0.5, upper: 6.0}     # Ah, capacity of ONE pack (per_motor: one pack per motor)
  l_ht: {lower: 0.4, upper: 1.2}         # m
  S_ht: {lower: 0.02, upper: 0.15}       # m^2
  S_vt: {lower: 0.01, upper: 0.10}       # m^2
  x_batt: {lower: -0.35, upper: 0.2}     # m, battery station (trims the CG)
  x_cb_frac: {lower: 0.0, upper: 0.6}    # cargo bay / payload centre as a chord fraction (trims the CG)
  Kv: {lower: 500.0, upper: 1500.0}      # rpm/V, motor Kv (the reference motor above rewound), PLACEHOLDER bounds
                                         # (Q34); starts at propulsion.Kv unless initial gives Kv. Drop it (e.g.
                                         # fixed_design_variables: [Kv], configs/*_fixed_kv.yaml) for a fixed motor

initial: {b: 1.2, c: 0.3, tc_scale: 1.0, camber_scale: 1.0, alpha_cruise: 6.0, v: 22.0, capacity: 3.0,
          l_ht: 0.8, S_ht: 0.06, S_vt: 0.03, x_batt: -0.1}
