# Robust design optimisation of the 2024-25 multipoint problem (aircrafter2/robustness/rdo_multipoint.py).
# Everything not listed here is configs/dbf2025_multipoint.yaml. Formulation as docs/studies/rdo_study.md: UDR,
# maximise mu - k sigma of the flight score, mu -/+ beta sigma robust constraints; every spread is a PLACEHOLDER.
extends: dbf2025_multipoint.yaml

robust:
  enabled: true
  uncertainty_config: uncertainty.yaml   # the shared list (Kv a DV: Kv_factor, Rm_ref); m_pay is computed here (stores)
  parameters:                            # entries for this problem only (the shared list stays the RDO study's)
    - {name: store_drag_factor, dist: uniform, nominal: 1.0, spread: 0.30, source: PLACEHOLDER}  # OPEN_QUESTIONS Q37
  active: null                           # set from the multipoint screening (studies/results_2025.py screen)
  quadrature: udr
  points: 3
  objective: mean_plus_k_sigma           # with the score maximised: mu - k sigma
  k: 1.0
  beta: 2.0
  # the RDO study's robust list plus rpm_margin and I_margin (with Kv a DV the nominal-only rpm limit was broken in
  # 50 % of the samples, OPEN_QUESTIONS Q33); applied at both mission points
  robust_constraints: [energy_margin, thrust_margin_static, stall_margin, SM, wall_ratio, r_tube, rpm_margin, I_margin]
  screening_threshold: 0.9
  max_dim: 7
