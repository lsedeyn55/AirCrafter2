# The 2025-26 DBF ruleset (Banner Towing Bush Plane): every value that depends on the competition rules, plus the
# reference aircraft's components (Project Humpback, the 2025-26 USYD aircraft). Layer 3 (code defaults <
# placeholders.yaml < this file < the problem config < the study variant), opt-in: the 2025-26 configs set
# 'ruleset: rulesets/dbf_2025_26.yaml'. Plan: docs/RESULTS_2026_PLAN.md.
#
# One value per line, as a dotted path into the config schema. Comment: # <units>; <PLACEHOLDER | cited>; Q..; <source>
# [R26] = 2026-DBF-Rules.pdf printed page ("N of 34"); [HB] = 2026 USYD DBF Design Report (Project Humpback), printed
# page ("Page N of 60" = PDF page + 1) / table; [TM7] = THESIS/3_LITERATURE/26 competition/T-Motor AT7215/;
# [APC] = APC-Propeller-RPM-Limits-rev5.pdf. PLACEHOLDER = not sourced (docs/OPEN_QUESTIONS.md).
#
# Why Humpback's motor, ESC and pack are here and not in placeholders.yaml (where Woombah's are): placeholders.yaml
# feeds every single-point and 2024-25 config, whose references must not move; the reference aircraft's components
# are carried by its ruleset, as the 2024-25 ruleset carries Woombah's airframe (n_panels, cargo box).

# --- site ---
altitude: 396.24                             # m = 1300 ft; cited; no Q; Wichita elevation [HB p. 12 Table 7]; fly-off at the Textron Aviation Employees Flying Club, Wichita KS [R26 pp. 8-9]

# --- mission ---
mission_time: 300.0                          # s; cited; no Q; 5-minute windows [R26 pp. 19-20]
course.preset: dbf_2025_360_mid              # -; cited; no Q; [R26 p. 17] course figure: 360 deg turn halfway along the back (downwind) straight; turn markers 500 ft from the start line [R26 p. 18]
course.pilot_reaction_time_s: 3.0            # s per lap; PLACEHOLDER; no Q; performance_modeller.m
course.turn_drift: true                      # -; cited; no Q; turns drift with the wind (docs/RESULTS_2026_PLAN.md §4.7; decision 2026-10-26)
course.takeoff.in_mission_time: true         # -; cited; no Q; time starts when the throttle is advanced for the first take-off [R26 pp. 19-20]
course.takeoff.start_offset_ft: 0.0          # ft; PLACEHOLDER; Q43; brake release on the start line
takeoff_distance: 106.68                     # m = 350 ft; cited; no Q; Humpback's design input, "lower than actual runway length" [HB p. 12 Table 7]; the rules set no take-off limit [R26 p. 18]

# --- airframe (Humpback's, the 2025-26 reference) ---
mass.options.n_panels: 2                     # -; cited; no Q; modular two-piece wing [HB p. 26, p. 37]

# --- propulsion: Humpback's (single nose tractor, one pack) ---
propulsion.Kv: 245.0                         # rpm/V; cited; Q7; reference motor T-Motor AT7215 245 KV [HB Table 27 p. 29]; [TM7]
propulsion.Rm: 0.020                         # ohm; cited; Q7; AT7215 KV245 internal resistance 20 mOhm [TM7]; scaled (Kv_ref/Kv)^2 when Kv is a DV
propulsion.I0: 2.4                           # A; cited; Q7; idle current at 10 V [TM7]; scaled Kv/Kv_ref when Kv is a DV (the catalogue: constant)
propulsion.m_motor: 0.555                    # kg; cited; Q7; 555 g incl. cable [TM7] ([HB] Table 36 motor row 1.27 lb = 0.576 kg, may include the mount)
propulsion.m_esc: 0.1089                     # kg = 0.24 lb; cited; Q7; Hargrave microDRIVE LP [HB p. 44 Table 36]
propulsion.I_max: 60.0                       # A; cited; Q7; Hargrave microDRIVE LP continuous rating [HB p. 28 §4.6.1]
propulsion.m_prop: 0.098                     # kg; cited; Q61; APC LP19012E (19x12E) 98.08 g (Motion RC listing)
propulsion.e_spec: 176.5                     # Wh/kg; cited; Q8; 97.68 Wh (GNB 8S 3300 mAh, [HB p. 42]) / 1.22 lb [HB Table 36]
energy_reserve: 0.0                          # fraction of usable energy; cited; Q24; usable_fraction 0.8 already holds Humpback's single 20 % margin, 80 Wh of 100 Wh "to protect battery" [HB p. 12 Table 7]; 0.2 on top flew 64 % of the pack
stability.x_motor: -0.5334                   # m = -21.0 in; cited; no Q; motor station from the wing LE [HB Table 36]

# --- tails and stability (relaxed constraint set, docs/RESULTS_2026_PLAN.md §4.5) ---
stability.AR_ht: 4.0                         # -; cited; no Q; Humpback HS [HB p. 36]
stability.AR_vt: 1.5                         # -; cited; no Q; Humpback VS [HB p. 36]
stability.tc_tail: 0.101                     # -; cited; Q37; SD8020 [HB p. 27]: 10.1 % at 27.6 % chord from the UIUC coordinates (aerosandbox airfoil_database/sd8020.dat)
stability.SM_min: 0.25                       # -; cited; Q9, Q62; a real 5-10 % floor ([HB] 10-13 % as built, pp. 34, 43; DBF top reports 16-27 %; Raymer 6th ed. p. 593) plus the model's NP offset ~0.2 c aft of eCalc (Q62): 0.22-0.30 in the model frame
stability.SM_max: 0.47                       # -; cited; Q9, Q62; the largest modelled SM of the as-flown USYD aircraft, rounded up (decisions 2026-10-26/27): Humpback M3 0.460, M2 0.410 (validation_2026.md); Woombah M2 0.230. The model's NP sits ~0.2 c aft of the teams' eCalc NP (no fuselage term), so the reports' 10-20 % are not comparable
stability.V_h_max: 0.80                      # -; cited; Q9; the largest flown: [HB] 0.80 (p. 27); [W] 0.722; [OH] 0.66
stability.V_v_max: 0.08                      # -; cited; Q9; the largest flown: [HB] 0.08 (p. 27); [OH] 0.072; [W] 0.059

# --- scoring ---
multipoint.kind: dbf2026                     # -; cited; no Q; payload and banner stores, the dbf2026 plug-in
multipoint.scoring.NI_max: 2800.0            # -; PLACEHOLDER; Q52; best team's Net_Income: USYD's M2 1.54 [2026 results] with [HB] Table 43's flight (42/14, 8 laps, 97.68 Wh) gives 2776
multipoint.scoring.B_max: 1500.0             # in; PLACEHOLDER; Q52; best team's laps x banner length / RAC: USYD's M3 2.52 with 4 laps x 197 in / 0.996 gives 1521

# --- rule limits ---
multipoint.rules.togw_max_lb: 55.0           # lb; cited; no Q; TOGW must be less than 55 lb [R26 p. 13]
multipoint.rules.energy_total_max_Wh: 100.0  # Wh; cited; no Q; total propulsion energy and per pack [R26 p. 16]
multipoint.rules.fuse_max_A: 100.0           # A; cited; no Q; arming fuse rating [R26 p. 15]
multipoint.rules.c_rating: 100.0             # C; cited; Q8; GNB 3300 mAh 8S sold at 100C, 549 ± 30 g (Rotorama listing), matching [HB] Table 36's 1.22 lb (553 g) pack
multipoint.rules.laps_m2_min: null           # laps; cited; no Q; M2 has no lap requirement [R26 p. 19]
multipoint.rules.span_max_ft: 5.0            # ft; cited; no Q; maximum wingspan [R26 p. 10]: the upper bound of b
multipoint.rules.pax_per_cargo_min: 3.0      # -; cited; no Q; >= 3 passengers per piece of cargo [R26 p. 10] (a capacity rule, applied to the flown counts)
multipoint.rules.fuselage_span_ratio_max: 1.5  # -; PLACEHOLDER; Q55; payload fuselage length <= 1.5 x span (decision 2026-10-27): the counts' growth is otherwise unbounded (the Ground Mission's loading time is not modelled, Q53); Humpback: 0.99 m / 1.50 m = 0.66

# --- payload and banner design variables ---
multipoint.payload.n_p.lower: 3.0            # passengers; cited; no Q; >= 3 passengers [R26 p. 10]
multipoint.payload.n_p.upper: 500.0           # passengers; PLACEHOLDER; Q55; no bound in practice: the fuselage-length cap binds (decision 2026-10-27)
multipoint.payload.n_c.lower: 1.0            # cargo; cited; no Q; >= 1 cargo [R26 p. 11]
multipoint.payload.n_c.upper: 200.0           # cargo; PLACEHOLDER; Q55; no bound in practice: the fuselage-length cap binds
multipoint.payload.L_banner.lower: 10.0      # in; cited; no Q; minimum banner length [R26 p. 12]
multipoint.payload.L_banner.upper: 275.0     # in; PLACEHOLDER; Q56; the longest banner the team built [HB p. 41 Table 34]
multipoint.payload_initial.n_p: 42.0         # passengers; cited; no Q; Humpback [HB Table 36]
multipoint.payload_initial.n_c: 14.0         # cargo; cited; no Q; Humpback [HB Table 36]
multipoint.payload_initial.L_banner: 197.0   # in; cited; no Q; Humpback's competition banner [HB p. 40]

# --- uncertainty ---
# Wichita in April (docs/RESULTS_2026_PLAN.md §4.6): mean 12.6 mph = 5.6 m/s (Weather Spark, Q39); [HB] 16.9 ft/s
# (NWS normals, p. 32). Uniform 0-10 m/s (mean 5): the light designs' validity edge is the lift-off speed into the
# wind (counted as the wind limit, separately from MDA failures). The direction is the shift from the course axis that
# the Flight Line Judge set to the prevailing wind [R26 p. 17]: +/-30 deg, inside the daytime Pasquill classes (Q59).
uncertainty:
  - {name: lap.wind,     dist: uniform, nominal: 5.0, spread: 5.0, units: m/s, source: PLACEHOLDER}  # m/s; PLACEHOLDER; Q39; wind speed 0-10 m/s
  - {name: lap.wind_dir, dist: uniform, nominal: 0.0, spread: 30.0, units: deg, source: 'Woodward 1998'}  # deg; cited; Q59; uniform ±30° (σ 17°) sits inside Pasquill daytime classes B-D, σθ 7.5-22.5° at 10 m (Woodward 1998, AIChE, App. A); ±45° (σ 26°) is beyond class A
  - {name: banner_drag_factor, dist: uniform, nominal: 1.0, spread: 0.1915, relative: true, source: 'HB Table 41'}  # -; cited; Q56; C_D,b 0.019-0.028 (ripstop, LE-only reinforcement, 118-275 in) about 0.0235
