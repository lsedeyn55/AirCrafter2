# Robust design optimisation of dbf2025_multipoint_final.yaml, with the settings of the 2024-25 study: k = 1, beta = 2.
# The reduced mass-and-wind set is uncertainty_2025_reduced.yaml: f_build nominal 1.0 +/-30 %, f_tb +/-30 %, m_avionics
# +/-15 %, wind 0-7 m/s. NOT uncertainty_2025_reduced_calibrated.yaml (f_build centred on 2.74, superseded 2026-10-23):
# the USYD factors already carry the build bias, so that file would apply the correction twice (RERUN_2025_LOG.md).
extends: dbf2025_multipoint_final.yaml

robust:
  enabled: true
  uncertainty_config: uncertainty_2025_reduced.yaml
  active: null                           # all four (d = 4): UDR N = 2d + 1 = 9 nodes x 2 points
  quadrature: udr
  points: 3
  objective: mean_plus_k_sigma           # with the score maximised: mu - k sigma
  k: 1.0
  beta: 2.0
  robust_constraints: [energy_margin, thrust_margin_static, stall_margin, SM, wall_ratio, r_tube, rpm_margin, I_margin]
  screening_threshold: 0.9
  max_dim: 7
