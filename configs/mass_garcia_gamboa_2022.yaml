# Garcia & Gamboa (2022) mass model defaults: circular tube spar wing concept.
# Source: Garcia, G.L. & Gamboa, P.V. (2022), Aeronaut. J. 126, 249-296, doi:10.1017/aer.2021.68
#
# These are the paper's values: the published model (verification, configs/verification/) and the uncalibrated
# comparisons. Every problem config loads configs/placeholders.yaml above this file, and its 'mass correction factors
# (USYD calibration)' block replaces the correction factors and the tail model (docs/studies/mass_calibration_usyd.md).
# All values are SI. Input names and units are listed in aircrafter2/mass/garcia_gamboa/inputs.py.

options:
  max_mode: ks                 # smooth max on the gradient path; "hard" for reporting/verification
  rho_ks: 100.0                # log-space KS sharpness: over-estimate <= 2**(1/100) = 0.7 % for two terms
  softplus_scale: 1.0e-6       # m, smooth floor on the divergence thickness (PLAN G9)
  deflection_mode: paper       # Eq. 110 as printed; "exact" = Euler-Bernoulli (PLAN G10)
  torsion_stiffness_mode: paper  # Eq. 115 as printed; "bredt" = 2 pi r^3 G t (PLAN G12)
  tail_boom_load_mode: paper   # Eq. 55 with Eq. 5 as printed: reproduces Table 15, and f_tb was fitted with it (PLAN G19)
  sizing_radius_mode: paper    # K_tube = r/c_mean (Sec. 2.2.2) with sizing chord c_root (Sec. 3.3): reproduces Table 15;
                               # identical to "physical" for a rectangular wing, unconservative for taper (PLAN G23)
  include_twist: false         # G&G Sec. 4.2 sized torsion stiffness by divergence only
  use_min_gauge: true         # spar tube minimum wall (t_tube_min)
  tb_min_gauge: true           # tail boom minimum wall (t_tb_min); f_tb below is fitted on this basis
  r_tube_mode: derived         # decision D1: r = k_fill * (t/c at spar) * c_root / 2 - clearance
  n_panels: 1
  statistical_model: all       # Eq. 124
  standalone_solver: true

inputs:
  # Safety factor and air (Table 3)
  SF: 1.5                      # Table 3 / Eq. 42
  rho: 1.225                   # Table 3
  # Load case (Table 3 values for the tube-spar aircraft; USYD values are an open question, Q12)
  n: 2.0                       # Table 3 (UBI11, GRA13, UBI15)
  div_speed_factor: 1.2        # text after Eq. 47
  x_spar: 0.25                 # brief default; Eq. 117 vanishes at the quarter chord
  # The spar and tail-boom materials (Table 13), delta_tip_ratio and theta_tb_max (Table 3), the tube fit (k_fill,
  # clearance) and t_tube_min are in configs/placeholders.yaml (docs/PLACEHOLDERS_RULESETS_PLAN.md). A file that
  # loads this one alone (configs/verification/) gets the inputs.py defaults, which are the same values.
  # Balsa ribs and LE/TE stringers (Table 13)
  sigma_balsa: 1.0e+7          # Table 13
  tau_balsa: 1.4e+6            # Table 13
  rho_balsa: 200.0             # Table 13
  # Covering film (Table 13; 0.018 for UBI11)
  gamma_film: 0.036
  # Cross-section stringer ratios (Table 12, UBI11/UBI15)
  le_ratio: 0.021
  te_ratio: 0.021
  c_rib_frac: 0.7              # Sec. 3.3.3 "around 70 % of the chord"
  # Combined correction factors, circular tube spar concept (Table 14)
  f_wing: 1.120
  f_tb: 0.847                  # refitted to Table 15 real boom masses with a 1.0 mm minimum wall
                               # (docs/studies/tail_boom_calibration.md); G&G Table 14's 12.81 applies only to
                               # load-sized walls (tb_min_gauge: false)
  f_ht: 0.6411
  f_vt: 0.3414                 # lower trend; 0.7753 = "heavy/composite tail" option (Table 14, Fig. 11b)
  f_cb: 0.7878                 # kg/m^2
  f_gear: 0.0089
  t_tb_min: 1.0e-3             # m; USYD CF tube walls (Spar Sizer 3.1: 22/20 and 20/18 mm OD/ID)
