# AirCrafter lap modeller coupled to aero + mass (MDF); minimise the 3-lap time.
# Schema: aircrafter2/problems/lap_mdo.py (LapMDOConfig, extends the aero_mass schema). SI units.
# Values marked PLACEHOLDER are not USYD data (docs/OPEN_QUESTIONS.md). Shared placeholders (payload, boom, cargo
# bay, minimum tube, n_crit): configs/placeholders.yaml; altitude, mission time: configs/rulesets/generic.yaml.

placeholders: placeholders.yaml        # universal placeholders and assumptions (layer 2)
ruleset: rulesets/generic.yaml          # rule-dependent values: altitude, mission time, course, headwind spread (layer 3)

airfoil: {seed: naca4412, n_modes: 0}
aero: {num_x: 2, num_y: 41, spacing: cosine, model_size: xlarge}

mass_config: mass_garcia_gamboa_2022.yaml   # base mass-model config, relative to this file
mass:                    # overrides merged over mass_config
  inputs:
    n: 5.0               # assumptions_file.m load factor
    m_sys: 1.2           # kg, PLACEHOLDER propulsion + battery + avionics (full_mdo computes it from the powertrain)

V: 20.0                  # m/s, initial cruise speed; now a design variable (also the G&G load design speed)

geometry:
  l_ht: 0.8              # m, PLACEHOLDER tail arm
  S_ht: 0.06             # m^2, PLACEHOLDER
  S_vt: 0.03             # m^2, PLACEHOLDER
  x_spar: 0.25           # brief default

clmax_ratio_min: 1.44    # cruise at >= 1.2 V_stall
wall_ratio_max: 0.2      # thin-wall validity of the tube equations

polar_turn_frac: 0.95    # three-point polar: cruise, mid, and C_L = 0.95 C_L,max (no extrapolation)
eta: 0.7                 # assumptions_file.m; no propulsion model here (full_mdo uses the powertrain)
mu_roll: 0.02            # assumptions_file.m
E_avail: 288000.0        # J = 0.8 * 100 Wh, assumptions_file.m
n_struct: 5.0            # assumptions_file.m
power_available: 300.0   # W electrical, fixed PLACEHOLDER; full_mdo computes it from the powertrain

design_variables:
  b: {lower: 0.9, upper: 1.52}
  c: {lower: 0.15, upper: 0.45}
  tc_scale: {lower: 0.5, upper: 1.6}
  camber_scale: {lower: 0.0, upper: 2.0}
  v: {lower: 10.0, upper: 30.0}       # m/s, inputs_file.m V range

initial: {b: 1.2, c: 0.3, tc_scale: 1.0, camber_scale: 1.0, alpha_cruise: 6.0, v: 20.0}
